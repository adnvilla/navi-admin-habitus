# Graphiti MCP Server + FalkorDB (imagen combinada oficial de Zep).
# Levantar:  docker compose up -d
# Bajar:     docker compose down          (conserva datos)
#            docker compose down -v       (borra el grafo)
#
# Endpoints:
#   MCP (HTTP):        http://localhost:8000/mcp/
#   Health:            http://localhost:8000/health
#   FalkorDB Browser:  http://localhost:3000
#   FalkorDB (redis):  localhost:6379
#
# Imagen prebuilt. Para construir desde el repo local (solo lectura) en vez de
# usar Docker Hub, descomentar el bloque `build` y correr `docker compose build`.

name: graphiti

services:
  graphiti-falkordb:
    image: zepai/knowledge-graph-mcp:${GRAPHITI_IMAGE_TAG:-1.1.0-graphiti-0.30.1}
    # build:
    #   context: ../../graphiti/mcp_server
    #   dockerfile: docker/Dockerfile
    container_name: graphiti-falkordb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # FalkorDB (ambos servicios viven en el mismo contenedor)
      FALKORDB_URI: redis://localhost:6379
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      FALKORDB_DATABASE: ${FALKORDB_DATABASE:-default_db}
      BROWSER: ${BROWSER:-1}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # LLM / embeddings (OpenAI). El config.yaml de la imagen lee estas vars.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Falta OPENAI_API_KEY en graphiti/.env}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-text-embedding-3-small}
      # Graphiti
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-main}
      SEMAPHORE_LIMIT: ${SEMAPHORE_LIMIT:-10}
      CONFIG_PATH: /app/mcp/config/config.yaml
    # Solo loopback: FalkorDB corre sin password, no exponer a la red local.
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
      - "127.0.0.1:${FALKORDB_UI_PORT:-3000}:3000"
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
      - mcp_logs:/var/log/graphiti
      # Arranque propio: persistencia AOF + SHUTDOWN SAVE al bajar (ver script).
      - ./start-services.sh:/start-services.sh:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping && curl -fs http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  falkordb_data:
  mcp_logs:
